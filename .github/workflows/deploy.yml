name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      alert_probe:
        description: "Exercise the agent failure route without changing production"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: chrondle-production
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for production gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Exercise agent alert route
        if: inputs.alert_probe == true
        run: |
          echo "::error::Controlled deployment alert probe; production was not changed"
          exit 1
      - name: Require green CI and secret scan on this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            ready=true
            for workflow in ci.yml trufflehog.yml; do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" \
                --jq '.workflow_runs[0] | {status, conclusion, html_url}')
              status=$(jq -r '.status // "missing"' <<< "$run")
              conclusion=$(jq -r '.conclusion // "pending"' <<< "$run")
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "::error::$workflow is $conclusion on $GITHUB_SHA: $(jq -r .html_url <<< "$run")"
                exit 1
              fi
              [[ "$status" == completed && "$conclusion" == success ]] || ready=false
            done
            if [[ "$ready" == true ]]; then
              echo "CI and secret scan passed on $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for exact-revision gates (attempt $attempt/90)"
            sleep 20
          done
          echo "::error::Timed out waiting for this revision's production gates"
          exit 1

  backend:
    name: Deploy compatible backend
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate production configuration
        run: node scripts/verify-env-config.mjs production
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SYNC_SECRET: ${{ secrets.STRIPE_SYNC_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL: ${{ secrets.STRIPE_PRICE_ANNUAL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      - name: Validate Stripe prices exist
        run: node scripts/verify-stripe-config.mjs --live
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL: ${{ secrets.STRIPE_PRICE_ANNUAL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      # Expand/contract only: the old web release stays live during this step.
      - name: Deploy Convex production
        run: bun run deploy:backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Verify backend before Worker activation
        run: bun run deploy:verify
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

  cloudflare:
    name: Deploy Cloudflare Worker
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment:
      name: Production
      url: https://www.chrondle.app
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies without production credentials
        run: bun install --frozen-lockfile
      - name: Build exact-revision Cloudflare artifact with public settings only
        run: bun run build:cf
        env:
          CHRONDLE_REVISION: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      - name: Save the Worker rollback version
        id: previous
        run: |
          set -euo pipefail
          version=$(bunx wrangler deployments list --env production --json \
            | bun --eval 'console.log(JSON.parse(await Bun.stdin.text()).at(-1).versions[0].version_id)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production Worker and source-owned domains
        id: activate
        run: bunx wrangler deploy --env production --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the running release
        run: |
          bun --eval '
            const health = await (await fetch("https://www.chrondle.app/api/health", {cache: "no-store", redirect: "error"})).json();
            if (health.revision !== process.env.GITHUB_SHA) throw new Error("Wrong production revision");
          '
          bun run doctor:hosting
      - name: Verify canonical Stripe webhook ingress after release
        run: node scripts/verify-webhook-redirect.mjs
      - name: Roll back Worker on failed activation or smoke
        if: failure() && steps.activate.outcome != 'skipped' && steps.previous.outcome == 'success'
        run: bunx wrangler rollback "${{ steps.previous.outputs.version }}" --env production --yes --message "Failed release $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
