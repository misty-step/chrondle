name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      alert_probe:
        description: "Exercise the agent failure route without changing production"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: chrondle-production
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for production gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Exercise agent alert route
        if: inputs.alert_probe == true
        run: |
          echo "::error::Controlled deployment alert probe; production was not changed"
          exit 1
      - name: Require green CI and secret scan on this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            ready=true
            for workflow in ci.yml trufflehog.yml; do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" \
                --jq '.workflow_runs[0] | {status, conclusion, html_url}')
              status=$(jq -r '.status // "missing"' <<< "$run")
              conclusion=$(jq -r '.conclusion // "pending"' <<< "$run")
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "::error::$workflow is $conclusion on $GITHUB_SHA: $(jq -r .html_url <<< "$run")"
                exit 1
              fi
              [[ "$status" == completed && "$conclusion" == success ]] || ready=false
            done
            if [[ "$ready" == true ]]; then
              echo "CI and secret scan passed on $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for exact-revision gates (attempt $attempt/90)"
            sleep 20
          done
          echo "::error::Timed out waiting for this revision's production gates"
          exit 1

  backend:
    name: Deploy compatible backend
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate production configuration
        run: node scripts/verify-env-config.mjs production
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SYNC_SECRET: ${{ secrets.STRIPE_SYNC_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL: ${{ secrets.STRIPE_PRICE_ANNUAL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      - name: Validate Stripe prices exist
        run: node scripts/verify-stripe-config.mjs --live
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL: ${{ secrets.STRIPE_PRICE_ANNUAL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      # Expand/contract only: the old web release stays live during this step.
      - name: Deploy Convex production
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Verify backend before host activation
        run: bun run deploy:verify
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

  host:
    name: Deploy native host
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment:
      name: Production
      url: https://chrondle.app
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      # The host pulls public GitHub metadata and source; Actions has no host key.
      # It activates only while this observer is running and backend is green.
      - name: Require completed host smoke and exact production revision
        run: node scripts/verify-native-release.mjs --wait
      - name: Verify Stripe webhook ingress after release
        run: node scripts/verify-webhook-redirect.mjs
