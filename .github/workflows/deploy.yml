name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      prepare_cloudflare_backend:
        description: "Prepare the paused Cloudflare backend only; do not switch the frontend or stop Convex"
        type: boolean
        default: false
      alert_probe:
        description: "Exercise the agent failure route without changing production"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: chrondle-production
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for production gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Exercise agent alert route
        if: inputs.alert_probe == true
        run: |
          echo "::error::Controlled deployment alert probe; production was not changed"
          exit 1
      - name: Require green CI and secret scan on this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            ready=true
            for workflow in ci.yml trufflehog.yml; do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" \
                --jq '.workflow_runs[0] | {status, conclusion, html_url}')
              status=$(jq -r '.status // "missing"' <<< "$run")
              conclusion=$(jq -r '.conclusion // "pending"' <<< "$run")
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "::error::$workflow is $conclusion on $GITHUB_SHA: $(jq -r .html_url <<< "$run")"
                exit 1
              fi
              [[ "$status" == completed && "$conclusion" == success ]] || ready=false
            done
            if [[ "$ready" == true ]]; then
              echo "CI and secret scan passed on $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for exact-revision gates (attempt $attempt/90)"
            sleep 20
          done
          echo "::error::Timed out waiting for this revision's production gates"
          exit 1

  backend:
    name: Deploy compatible backend
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate production configuration
        if: inputs.prepare_cloudflare_backend != true
        run: node scripts/verify-env-config.mjs production
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SYNC_SECRET: ${{ secrets.STRIPE_SYNC_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL: ${{ secrets.STRIPE_PRICE_ANNUAL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      - name: Validate Stripe prices exist
        if: inputs.prepare_cloudflare_backend != true
        run: node scripts/verify-stripe-config.mjs --live
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL: ${{ secrets.STRIPE_PRICE_ANNUAL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      # Expand/contract only: the old web release stays live during this step.
      - name: Deploy Convex production
        if: inputs.prepare_cloudflare_backend != true
        run: bun run deploy:backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Verify backend before Worker activation
        if: inputs.prepare_cloudflare_backend != true
        run: bun run deploy:verify
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      - name: Validate runtime-only Cloudflare backend bindings
        if: inputs.prepare_cloudflare_backend == true
        run: node backend/scripts/production-bindings.mjs --check
        env:
          BACKEND_PRODUCTION_OPERATOR_ACCESS: ${{ secrets.BACKEND_PRODUCTION_OPERATOR_ACCESS }}
          BACKEND_PRODUCTION_ENV: ${{ secrets.BACKEND_PRODUCTION_ENV }}
      - name: Prepare the separate Cloudflare backend without changing the serving frontend
        if: inputs.prepare_cloudflare_backend == true
        working-directory: backend
        run: bunx wrangler deploy --env production --var "REVISION:$GITHUB_SHA" --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Bind production integrations only after compilation
        if: inputs.prepare_cloudflare_backend == true
        working-directory: backend
        run: |
          set -euo pipefail
          node scripts/production-bindings.mjs | bunx wrangler secret bulk --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKEND_PRODUCTION_OPERATOR_ACCESS: ${{ secrets.BACKEND_PRODUCTION_OPERATOR_ACCESS }}
          BACKEND_PRODUCTION_ENV: ${{ secrets.BACKEND_PRODUCTION_ENV }}
      - name: Read back the prepared Cloudflare backend revision
        if: inputs.prepare_cloudflare_backend == true
        run: |
          bun --eval '
            const response = await fetch("https://chrondle-backend.mistystep.io/_backend/version", {cache: "no-store", redirect: "error"});
            const identity = await response.json();
            if (!response.ok || identity.service !== "chrondle-backend" || identity.environment !== "production" || identity.revision !== process.env.GITHUB_SHA) throw new Error("Prepared backend identity mismatch: " + JSON.stringify(identity));
            console.log(JSON.stringify(identity));
          '
          bun backend/scripts/verify-backend.mjs check --url https://chrondle-backend.mistystep.io

  cloudflare:
    name: Deploy Cloudflare Worker
    if: inputs.prepare_cloudflare_backend != true
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment:
      name: Production
      url: https://www.chrondle.app
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies without production credentials
        run: bun install --frozen-lockfile
      - name: Build exact-revision Cloudflare artifact with public settings only
        run: bun run build:cf
        env:
          CHRONDLE_REVISION: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      - name: Exercise built Worker routes before activation
        run: bun run test:worker-routes
      - name: Require completed first DNS cutover
        run: |
          bun --eval '
            const response = await fetch("https://api.cloudflare.com/client/v4/zones/168e4a43b922ad6e8230f8aee76fce33", {
              headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}
            });
            const zone = await response.json();
            if (!response.ok || zone.result?.status !== "active") throw new Error("Complete the native Worker bootstrap and DNS cutover before merging; see docs/deployment-guide.md");
          '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Save the Worker rollback version
        id: previous
        run: |
          set -euo pipefail
          version=$(bunx wrangler deployments list --env production --json \
            | bun --eval 'console.log(JSON.parse(await Bun.stdin.text()).at(-1).versions[0].version_id)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production Worker and source-owned domains
        id: activate
        run: bunx wrangler deploy --env production --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify direct Worker readiness
        run: bun scripts/verify-worker-readiness.mjs https://chrondle.mistystep.io
      - name: Verify public release after DNS cutover
        run: |
          bun scripts/verify-worker-readiness.mjs https://chrondle.app https://www.chrondle.app
          bun run doctor:hosting
      - name: Verify canonical Stripe webhook ingress after release
        run: node scripts/verify-webhook-redirect.mjs
      - name: Roll back Worker on failed activation or smoke
        if: failure() && steps.activate.outcome != 'skipped' && steps.previous.outcome == 'success'
        run: bunx wrangler rollback "${{ steps.previous.outputs.version }}" --env production --yes --message "Failed release $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
