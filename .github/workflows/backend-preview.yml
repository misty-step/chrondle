name: Isolated backend preview

on:
  pull_request:
    paths:
      - "backend/**"
      - "convex/**"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/backend-preview.yml"
  workflow_dispatch:
    inputs:
      private_restore:
        description: "Deploy the separate whole-host Access-protected recovery target, not the public synthetic preview"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chrondle-backend-preview
  cancel-in-progress: false

jobs:
  preview:
    # Forks never receive the scoped deployment credential or operator configuration.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.private_restore == true && 'Restore' || 'Preview' }}
      url: ${{ inputs.private_restore == true && 'https://chrondle-backend-restore.mistystep.io' || 'https://chrondle-backend-preview.mistystep.io' }}
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      BACKEND_TARGET: ${{ inputs.private_restore == true && 'restore' || 'preview' }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout exact preview revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install with the repository lockfile and no deployment credentials
        run: bun install --frozen-lockfile
      - name: Deploy only the selected isolated script and resources
        working-directory: backend
        run: bunx wrangler deploy --env "$BACKEND_TARGET" --var "REVISION:$REVISION" --message "$REVISION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Bind only this environment's operator and optional synthetic identities
        working-directory: backend
        run: |
          set -euo pipefail
          bun --eval '
            const operator = process.env.BACKEND_TARGET === "restore"
              ? process.env.RESTORE_OPERATOR_ACCESS
              : process.env.PREVIEW_OPERATOR_ACCESS;
            if (!operator) throw new Error("Isolated operator configuration is missing");
            const bindings = {BACKEND_OPERATOR_ACCESS: operator};
            if (process.env.BACKEND_TARGET === "preview") {
              for (const [name, value] of Object.entries({EXTRA_AUTH_PROVIDERS: process.env.GAME_PROVIDERS, CLERK_SYNC_SECRET: process.env.CLERK_SYNC_SECRET, STRIPE_SYNC_SECRET: process.env.STRIPE_SYNC_SECRET})) {
                if (!value) throw new Error("Preview identity or webhook configuration is missing");
                bindings[name] = value;
              }
            }
            process.stdout.write(JSON.stringify(bindings));
          ' | bunx wrangler secret bulk --env "$BACKEND_TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_OPERATOR_ACCESS: ${{ secrets.BACKEND_PREVIEW_OPERATOR_ACCESS }}
          RESTORE_OPERATOR_ACCESS: ${{ secrets.BACKEND_RESTORE_OPERATOR_ACCESS }}
          GAME_PROVIDERS: ${{ secrets.BACKEND_PREVIEW_AUTH_PROVIDERS }}
          CLERK_SYNC_SECRET: ${{ secrets.CLERK_SYNC_SECRET }}
          STRIPE_SYNC_SECRET: ${{ secrets.STRIPE_SYNC_SECRET }}
      - name: Read back the exact hosted backend revision
        # The restore host is private on EVERY path. Its runtime is read back by
        # the named operator outside CI, never by putting that machine key in CI.
        if: inputs.private_restore != true
        run: |
          bun --eval '
            const { verifyWorkerReadiness } = await import("./scripts/verify-worker-readiness.mjs");
            const identity = await verifyWorkerReadiness({
              origin: "https://chrondle-backend-preview.mistystep.io",
              revision: process.env.REVISION,
              healthPath: "/_backend/version",
              isHealthy: identity => identity.service === "chrondle-backend" && identity.environment === "preview",
              // Worker and Durable Object rollout is eventually consistent.
              // Only a healthy old revision may wait; errors still fail at once.
              timeoutMs: 300000
            });
            console.log(JSON.stringify(identity));
          '

  frontend:
    name: Deploy isolated frontend preview
    if: inputs.private_restore != true
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: https://chrondle-preview.mistystep.io
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout the same preview revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install without deployment or integration credentials
        run: bun install --frozen-lockfile
      - name: Build the frontend with its source-owned preview bindings
        run: |
          # Wrangler vars are also the build inputs: browser, SSR and CSP agree.
          bun --eval '
            const { unstable_readConfig } = await import("wrangler");
            const config = unstable_readConfig({config: "wrangler.jsonc", env: "preview"});
            const child = Bun.spawn(["bun", "run", "build:cf"], {
              env: {...process.env, ...config.vars, CHRONDLE_REVISION: process.env.REVISION, NEXT_TELEMETRY_DISABLED: "1"},
              stdout: "inherit", stderr: "inherit"
            });
            process.exit(await child.exited);
          '
      - name: Deploy only the isolated frontend
        run: bunx wrangler deploy --env preview --message "$REVISION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Bind sandbox Clerk and synthetic webhook secrets to the isolated frontend
        run: |
          set -euo pipefail
          bun --eval '
            const key = process.env.CLERK_RUNTIME_KEY?.trim();
            if (!key?.startsWith("sk_test_")) throw new Error("The existing repository CLERK_SECRET_KEY is not a sandbox key; do not bind a production key to the synthetic preview");
            const names = ["CLERK_WEBHOOK_SECRET", "CLERK_SYNC_SECRET", "STRIPE_WEBHOOK_SECRET", "STRIPE_SYNC_SECRET"];
            const hooks = Object.fromEntries(names.map(name => {
              const value = process.env[name];
              if (!value) throw new Error("Missing Preview webhook secret: " + name);
              return [name, value];
            }));
            process.stdout.write(JSON.stringify({CLERK_SECRET_KEY: key, ...hooks}));
          ' | bunx wrangler secret bulk --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_RUNTIME_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLERK_SYNC_SECRET: ${{ secrets.CLERK_SYNC_SECRET }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SYNC_SECRET: ${{ secrets.STRIPE_SYNC_SECRET }}
      - name: Read back the frontend and its real backend connection
        run: |
          bun --eval '
            const url = "https://chrondle-preview.mistystep.io/api/health";
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch(url, {cache: "no-store", redirect: "error"});
                const health = await response.json();
                if (response.ok && health.service === "chrondle" && health.revision === process.env.REVISION && health.checks?.convex === "ok") {
                  console.log(JSON.stringify(health));
                  process.exit(0);
                }
              } catch {}
              await Bun.sleep(2000);
            }
            throw new Error("Isolated frontend did not serve this revision with a healthy backend");
          '
