name: Isolated backend preview

on:
  pull_request:
    paths:
      - "backend/**"
      - "convex/**"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/backend-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrondle-backend-preview
  cancel-in-progress: false

jobs:
  preview:
    # Forks never receive the scoped deployment credential or operator configuration.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: https://chrondle-backend-preview.mistystep.io
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout exact preview revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install with the repository lockfile and no deployment credentials
        run: bun install --frozen-lockfile
      - name: Deploy only the isolated preview script and resources
        working-directory: backend
        run: bunx wrangler deploy --env preview --var "REVISION:$REVISION" --message "$REVISION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Bind preview-only operator and synthetic game identities
        working-directory: backend
        run: |
          bun --eval 'if (!process.env.OPERATOR_ACCESS || !process.env.GAME_PROVIDERS) throw new Error("Preview identity configuration is missing"); process.stdout.write(JSON.stringify({BACKEND_OPERATOR_ACCESS: process.env.OPERATOR_ACCESS, EXTRA_AUTH_PROVIDERS: process.env.GAME_PROVIDERS}))' \
            | bunx wrangler secret bulk --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPERATOR_ACCESS: ${{ secrets.BACKEND_PREVIEW_OPERATOR_ACCESS }}
          GAME_PROVIDERS: ${{ secrets.BACKEND_PREVIEW_AUTH_PROVIDERS }}
      - name: Read back the exact hosted backend revision
        run: |
          bun --eval '
            const url = "https://chrondle-backend-preview.mistystep.io/_backend/version";
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch(url, {cache: "no-store", redirect: "error"});
                const identity = await response.json();
                if (response.ok && identity.service === "chrondle-backend" && identity.environment === "preview" && identity.revision === process.env.REVISION) {
                  console.log(JSON.stringify(identity));
                  process.exit(0);
                }
              } catch {}
              await Bun.sleep(2000);
            }
            throw new Error("Isolated preview did not serve this revision");
          '

  frontend:
    name: Deploy isolated frontend preview
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: https://chrondle-preview.mistystep.io
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout the same preview revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install without deployment or integration credentials
        run: bun install --frozen-lockfile
      - name: Build the frontend with its source-owned preview bindings
        run: |
          # Wrangler vars are also the build inputs: browser, SSR and CSP agree.
          bun --eval '
            const { unstable_readConfig } = await import("wrangler");
            const config = unstable_readConfig({config: "wrangler.jsonc", env: "preview"});
            const child = Bun.spawn(["bun", "run", "build:cf"], {
              env: {...process.env, ...config.vars, CHRONDLE_REVISION: process.env.REVISION, NEXT_TELEMETRY_DISABLED: "1"},
              stdout: "inherit", stderr: "inherit"
            });
            process.exit(await child.exited);
          '
      - name: Deploy only the isolated frontend
        run: bunx wrangler deploy --env preview --message "$REVISION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Bind only a test-mode Clerk server key to the isolated frontend
        run: |
          set -euo pipefail
          bun --eval '
            const key = process.env.CLERK_RUNTIME_KEY?.trim();
            if (!key?.startsWith("sk_test_")) throw new Error("The existing repository CLERK_SECRET_KEY is not a sandbox key; do not bind a production key to the synthetic preview");
            process.stdout.write(JSON.stringify({CLERK_SECRET_KEY: key}));
          ' | bunx wrangler secret bulk --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_RUNTIME_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - name: Read back the frontend and its real backend connection
        run: |
          bun --eval '
            const url = "https://chrondle-preview.mistystep.io/api/health";
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch(url, {cache: "no-store", redirect: "error"});
                const health = await response.json();
                if (response.ok && health.service === "chrondle" && health.revision === process.env.REVISION && health.checks?.convex === "ok") {
                  console.log(JSON.stringify(health));
                  process.exit(0);
                }
              } catch {}
              await Bun.sleep(2000);
            }
            throw new Error("Isolated frontend did not serve this revision with a healthy backend");
          '
