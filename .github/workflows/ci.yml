name: CI/CD Pipeline with Regression Detection

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # CI builds run on localhost and must not embed the production Clerk custom domain.
  # Production secrets are still validated separately in the deploy-oriented checks below.
  CI_CLERK_PUBLISHABLE_KEY: pk_test_aGVhbHRoeS1kb2UtMjMuY2xlcmsuYWNjb3VudHMuZGV2JA

jobs:
  production-route-guard:
    name: production-route-guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Stripe does not follow redirects. Keep this independent from Convex
      # deployment paths so every production web change replays the incident guard.
      - name: Verify Stripe webhook route does not redirect
        run: node scripts/verify-webhook-redirect.mjs

  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for vitest-coverage-report-action to post PR comments
    strategy:
      matrix:
        check: [lint, type-check, test]
      fail-fast: false
    name: ${{ matrix.check }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Dagger quality gate
        if: matrix.check != 'test'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: quality --check=${{ matrix.check }}

      - name: Run Dagger test coverage gate
        if: matrix.check == 'test'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: test-coverage-artifacts --output=coverage

      - name: Verify coverage artifacts
        if: matrix.check == 'test'
        run: |
          test -f coverage/coverage-summary.json
          test -f coverage/coverage-final.json
          ls -la coverage

      - name: Generate coverage summary
        if: matrix.check == 'test' && always()
        run: |
          echo "## 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json | jq '.total' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Coverage report generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Coverage Report
        if: matrix.check == 'test' && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          vite-config-path: vitest.config.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file-coverage-mode: changes

      - name: Upload coverage summary for badge publishing
        if: matrix.check == 'test' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7

  # Publish coverage badges to the dedicated `badges` branch with the
  # built-in GITHUB_TOKEN. README renders them through the shields.io
  # endpoint, pointing at raw.githubusercontent.com (no gist, no PAT).
  coverage-badges:
    name: coverage-badges
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage summary
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: coverage-badges-data

      - name: Publish badges to badges branch
        run: |
          set -euo pipefail

          # Generate badge JSON files with color logic
          for metric in lines branches functions statements; do
            VALUE=$(jq ".total.${metric}.pct" coverage-badges-data/coverage-summary.json)

            # Color thresholds: brightgreen (≥80%), yellow (≥70%), red (<70%)
            if (( $(echo "$VALUE >= 80" | bc -l) )); then
              COLOR="brightgreen"
            elif (( $(echo "$VALUE >= 70" | bc -l) )); then
              COLOR="yellow"
            else
              COLOR="red"
            fi

            # Capitalize metric for label
            LABEL=$(echo "$metric" | sed 's/.*/\u&/')
            echo "{\"schemaVersion\":1,\"label\":\"$LABEL\",\"message\":\"${VALUE}%\",\"color\":\"$COLOR\"}" > "$RUNNER_TEMP/coverage-${metric}.json"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish on a separate worktree so the checked-out ref is untouched
          BADGES_WORKTREE="$RUNNER_TEMP/badges-branch"
          rm -rf "$BADGES_WORKTREE"
          git fetch origin badges || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git worktree add "$BADGES_WORKTREE" -B badges origin/badges
          else
            git worktree add --detach "$BADGES_WORKTREE"
            (
              cd "$BADGES_WORKTREE"
              git checkout --orphan badges
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi
          cd "$BADGES_WORKTREE"
          cp "$RUNNER_TEMP"/coverage-*.json .
          git add coverage-*.json
          if git diff --cached --quiet; then
            echo "Coverage badges unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore(badges): update coverage badges [skip ci]"
          pushed=0
          for attempt in 1 2 3; do
            if git push origin badges; then
              pushed=1
              break
            fi
            git pull --rebase origin badges || true
            sleep 2
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::Failed to push coverage badges after 3 attempts"
            exit 1
          fi
          echo "Published coverage badges to the badges branch."

  validation:
    runs-on: ubuntu-latest
    name: validation-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Dagger validation gate
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: validation

  docs:
    runs-on: ubuntu-latest
    name: docs-link-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Dagger docs link check
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: docs-link-check

  build:
    runs-on: ubuntu-latest
    needs: [quality-checks, validation]

    # ENVIRONMENT VARIABLES DOCUMENTATION
    # ====================================
    # This job requires the following environment variables:
    #
    # Required for Convex (backend):
    # - CONVEX_DEPLOYMENT: The Convex deployment identifier (used for codegen)
    # - NEXT_PUBLIC_CONVEX_URL: The public Convex URL (embedded in client bundle)
    #
    # Required for Clerk (authentication):
    # - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: Public key for Clerk auth (embedded in client bundle)
    #
    # Optional:
    # - None currently
    #
    # IMPORTANT: Only NEXT_PUBLIC_* prefixed variables are embedded in the client bundle.
    # Server-side variables (without NEXT_PUBLIC_ prefix) remain secure on the server.
    #
    # These variables must be provided at:
    # 1. Build time - for Next.js to embed them in the client bundle
    # 2. Runtime - for the production server to start without errors

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Dagger build gate and export build artifacts
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: build-artifacts --next-public-convex-url=${{ secrets.NEXT_PUBLIC_CONVEX_URL }} --next-public-clerk-publishable-key=${{ env.CI_CLERK_PUBLISHABLE_KEY }} --output=.next

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .next/
          include-hidden-files: true

  e2e:
    runs-on: ubuntu-latest
    needs: build
    name: e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .next/

      - name: Run Dagger e2e gate and export report artifacts
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: e-2-e-artifacts --next-public-convex-url=${{ secrets.NEXT_PUBLIC_CONVEX_URL }} --next-public-clerk-publishable-key=${{ env.CI_CLERK_PUBLISHABLE_KEY }} --clerk-secret-key=env:CLERK_SECRET_KEY --output=.dagger-e2e

      - name: Upload Playwright report
        if: always() && hashFiles('.dagger-e2e/playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: .dagger-e2e/playwright-report/
          retention-days: 7

      - name: Fail if e2e test run failed
        run: |
          if [ ! -f .dagger-e2e/exit-code ]; then
            echo "❌ Missing e2e exit code artifact"
            exit 1
          fi

          code=$(cat .dagger-e2e/exit-code)
          if [ "$code" != "0" ]; then
            echo "❌ e2e tests failed with exit code $code"
            exit "$code"
          fi

          echo "✅ e2e tests passed"

  # Single required status check for branch protection.
  # Gates on all real CI jobs so only one check name needs to be configured.
  merge-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [quality-checks, validation, docs, build, e2e, verify-environment]
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more required jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more required jobs were cancelled"
            exit 1
          fi
          echo "✅ All required jobs passed"

  # Verify environment configuration before merge
  # Validates format and presence of required env vars
  verify-environment:
    name: Verify Environment Config
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Dagger CI environment validation
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: verify-env-config --environment=ci --next-public-convex-url=${{ secrets.NEXT_PUBLIC_CONVEX_URL }} --next-public-clerk-publishable-key=${{ env.CI_CLERK_PUBLISHABLE_KEY }} --clerk-secret-key=env:CLERK_SECRET_KEY --convex-deploy-key=env:CONVEX_DEPLOY_KEY
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Run Dagger production environment validation
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: verify-env-config --environment=production --next-public-convex-url=${{ secrets.NEXT_PUBLIC_CONVEX_URL }} --next-public-clerk-publishable-key=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} --next-public-stripe-publishable-key=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }} --stripe-price-monthly=${{ secrets.STRIPE_PRICE_MONTHLY }} --stripe-price-annual=${{ secrets.STRIPE_PRICE_ANNUAL }} --next-public-canary-api-key=${{ secrets.NEXT_PUBLIC_CANARY_API_KEY }} --clerk-secret-key=env:CLERK_SECRET_KEY --stripe-secret-key=env:STRIPE_SECRET_KEY --stripe-webhook-secret=env:STRIPE_WEBHOOK_SECRET --stripe-sync-secret=env:STRIPE_SYNC_SECRET --canary-api-key=env:CANARY_API_KEY
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SYNC_SECRET: ${{ secrets.STRIPE_SYNC_SECRET }}
          CANARY_API_KEY: ${{ secrets.CANARY_API_KEY }}

      - name: Run Dagger Stripe live validation
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.6"
          verb: call
          module: .
          args: verify-stripe-config --next-public-stripe-publishable-key=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }} --stripe-price-monthly=${{ secrets.STRIPE_PRICE_MONTHLY }} --stripe-price-annual=${{ secrets.STRIPE_PRICE_ANNUAL }} --require-live=true --stripe-secret-key=env:STRIPE_SECRET_KEY --stripe-webhook-secret=env:STRIPE_WEBHOOK_SECRET
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
